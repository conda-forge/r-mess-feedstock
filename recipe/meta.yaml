{% set version = "0.6.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-mess
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/MESS_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/MESS/MESS_{{ version }}.tar.gz
  sha256: f907763a0ca67f3a59bc3d51ab1cbdde78a4599ab7612a61e2e50cda282eb1e4

build:
  number: 1
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]
    - r-mass                     # [build_platform != target_platform]
    - r-matrix                   # [build_platform != target_platform]
    - r-glmnet                   # [build_platform != target_platform]
    - r-clipr                    # [build_platform != target_platform]
    - r-rcpp                     # [build_platform != target_platform]
    - r-kinship2                 # [build_platform != target_platform]
    - r-ggplot2                  # [build_platform != target_platform]
    - r-ggformula                # [build_platform != target_platform]
    - r-geem                     # [build_platform != target_platform]
    - r-geepack                  # [build_platform != target_platform]
    - r-mvtnorm                  # [build_platform != target_platform]
    - r-rcppparallel             # [build_platform != target_platform]
    - r-rcpparmadillo            # [build_platform != target_platform]
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-mass
    - r-matrix
    - r-rcpp
    - r-rcpparmadillo
    - r-rcppparallel
    - r-clipr
    - r-geem
    - r-geepack
    - r-ggformula
    - r-ggplot2
    - r-glmnet
    - r-kinship2
    - r-mvtnorm
    - libblas
  run:
    - r-base
    - r-mass
    - r-matrix
    - r-rcpp
    - r-clipr
    - r-geem
    - r-geepack
    - r-ggformula
    - r-ggplot2
    - r-glmnet
    - r-kinship2
    - r-mvtnorm

test:
  commands:
    - $R -e "library('MESS')"           # [unix]
    - "\"%R%\" -e \"library('MESS')\""  # [win]

about:
  home: https://github.com/ekstroem/MESS
  license: GPL-2.0-only
  summary: "A mixed collection of useful and semi-useful diverse statistical functions, some
    of which may even be referenced in The R Primer book. See Ekstr\xF8m, C. T. (2016).
    The R Primer. 2nd edition. Chapman & Hall."
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r
    - npavlovikj
